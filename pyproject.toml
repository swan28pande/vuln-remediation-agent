[project]
name = "vuln-remediation-agent"
version = "0.1.0"
description = "LLM agent that turns GitHub security alerts into tested fix pull requests"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "langgraph>=0.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
vuln-agent = "vuln_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vuln_agent"]
